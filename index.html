<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码报名</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .qr-wrapper {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .qr-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .tip {
            color: #888;
            font-size: 14px;
            margin-top: 20px;
        }

        /* 手机端优化 */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .qr-wrapper {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎉 微信扫码报名</h1>
    <p class="subtitle">请使用微信扫描下方二维码</p>

    <div class="qr-wrapper">
        <img src="images/微信二维码报名图片.png"
             alt="微信二维码报名图片"
             class="qr-image"
             onerror="this.src='images/微信二维码报名图片.jpg'; this.onerror=null;">
    </div>

    <p class="tip">💡 长按图片可保存到相册</p>
</div>
</body>
</html>
